<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — GoûtAfricain</title>
    <meta name="description" content="Contactez le restaurant GoûtAfricain : réservation, informations générales, plan d'accès.">
    <link rel="icon" type="image/png" href="images/logo-removebg-preview.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="contact">

<main>
    <section class="page-hero">
        <div class="page-hero__bg" style="background-image:url(images/about-2.jpg)"></div>
        <div class="container">
            <span class="eyebrow" data-reveal="up">Contact</span>
            <h1 class="split">Nous sommes là pour vous</h1>
            <div class="breadcrumb" data-reveal="up"><a href="index.html">Accueil</a>/<span>Contact</span></div>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="contact-cards">
                <div class="contact-card" data-reveal="up"><i class="far fa-calendar-check"></i><h3>Réservation</h3><a href="reservation.html">Réserver en ligne</a><br><span>reservGoûtAfricain@gmail.com</span></div>
                <div class="contact-card" data-reveal="up" style="--delay:.1s"><i class="far fa-envelope"></i><h3>Général</h3><span>infoGoûtAfricain@gmail.com</span></div>
                <div class="contact-card" data-reveal="up" style="--delay:.2s"><i class="fa fa-phone-alt"></i><h3>Téléphone</h3><a href="tel:+22796931275">+227 96931275</a></div>
            </div>

            <div class="contact">
                <div class="map" data-reveal="left">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3237.5004120522085!2d10.80875772229028!3d35.76308225816928!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2stn!4v1734156370772!5m2!1sfr!2stn" loading="lazy" title="Plan d'accès"></iframe>
                </div>
                <form id="contact-form" data-reveal="right">
                    <span class="eyebrow eyebrow--left">Écrivez-nous</span>
                    <h2 class="title">Envoyez-nous un <em>message</em></h2>
                    <div class="form-grid">
                        <div class="field"><input id="c-name" placeholder=" " required><label for="c-name">Nom complet</label></div>
                        <div class="field"><input id="c-email" type="email" placeholder=" " required><label for="c-email">E-mail</label></div>
                        <div class="field full"><input id="c-subject" placeholder=" " required><label for="c-subject">Sujet</label></div>
                        <div class="field full"><textarea id="c-message" placeholder=" " required></textarea><label for="c-message">Message</label></div>
                        <div class="full"><button class="btn">Envoyer <i class="fa fa-paper-plane"></i></button></div>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

<script src="js/main.js"></script>
</body>
</html>
