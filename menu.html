<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu — GoûtAfricain</title>
    <meta name="description" content="La carte de GoûtAfricain : plats principaux, végétariens, entrées, desserts, fruits et boissons d'Afrique.">
    <link rel="icon" type="image/png" href="images/logo-removebg-preview.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="menu">

<main>
    <section class="page-hero">
        <div class="page-hero__bg" style="background-image:url(images/afrique.png)"></div>
        <div class="container">
            <span class="eyebrow" data-reveal="up">Notre carte</span>
            <h1 class="split">Les saveurs de tout un continent</h1>
            <div class="breadcrumb" data-reveal="up"><a href="index.html">Accueil</a>/<span>Menu</span></div>
        </div>
    </section>

    <section class="section section--light">
        <div class="container">
            <div class="tabs" role="tablist"></div>
            <div class="menu-grid"></div>
        </div>
    </section>

    <section class="cta">
        <div class="cta__bg" data-parallax="-0.25"></div>
        <div class="container">
            <span class="eyebrow" data-reveal="up">L'eau à la bouche ?</span>
            <h2 class="split" data-reveal="up">Venez les goûter sur place</h2>
            <p data-reveal="up">Réservez votre table en quelques clics, nous préparons le reste.</p>
            <a href="reservation.html" class="btn" data-reveal="up">Réserver une table <i class="fa fa-arrow-right"></i></a>
        </div>
    </section>
</main>

<script src="js/main.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
